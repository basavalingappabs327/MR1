<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Reimbursement Claim - Form C & B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Application for Claiming Refund of Medical Expenses</h2>
    <p class="subtitle">FORM 'C' & FORM 'B' (Essentiality Certificate)</p>

    <form id="medicalClaimForm">
      <!-- Section 1: Form C Details -->
      <fieldset>
        <legend>Form C: Application Details</legend>

        <div class="form-group">
          <label for="name">1. Name & Designation of Govt. Servant (Block Letters):</label>
          <input type="text" id="name" name="name" required style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label for="office">2. Office in which employed:</label>
          <input type="text" id="office" name="office" required>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="basic">3. Basic Pay (Salary):</label>
            <input type="number" id="basic" name="basic" step="0.01" required>
          </div>

          <div class="form-group half">
            <label for="designation">Designation:</label>
            <input type="text" id="designation" name="designation" required>
          </div>
        </div>

        <div class="form-group">
          <label for="institution">4. Place of Duty / Institution:</label>
          <input type="text" id="institution" name="institution" required>
        </div>

        <div class="form-group">
          <label for="address">5. Full Residential Address:</label>
          <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="patientname">6. Name of Patient</label>
          <input type="text" id="patientname" name="patientname" placeholder="eg : in  child , raj age:11 months" required>
        </div>
        <div class="form-group">
          <label for="patientguardian">7. Patient's father/monther/spouse name :</label>
          <input type="text" id="patientguardian" name="patientname" placeholder="" required>
        </div>

        <div class="form-group">
            <label for="relationship">8. patient's relationship with applicant/govt Employee </label>
            <select id="relationship" name="relationship" required>
              <option value="" selected disabled>– ಆಯ್ಕೆ ಮಾಡಿ –</option>
              <option>Govt Employee(self)</option>
              <option>Father</option>
              <option>Mother</option>
              <option>spouse</option>
              <option>Son</option>
              <option>Daughter</option>
             
            </select>
          </div>
        

        <div class="form-group">
          <label for="illplace">9. Place at which patient fell ill:</label>
          <input type="text" id="illplace" name="illplace" required>
        </div>

        <div class="form-group">
          <label for="illness">10. Nature of Illness:</label>
          <input type="text" id="illness" name="illness" required>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="from">Treatment From Date:</label>
            <input type="date" id="from" name="from" required>
          </div>
          <div class="form-group half">
            <label for="to">Treatment To Date:</label>
            <input type="date" id="to" name="to" required>
          </div>
        </div>

        <div class="form-group">
          <label for="hospital">Hospital Name (Form B):</label>
          <input type="text" id="hospital" name="hospital" required>
        </div>
      </fieldset>

      <!-- Section 2: Form B Medicine Entries -->
      <fieldset>
        <legend>Form B: Essentiality Certificate - Medicines</legend>
        
        <table id="medicineTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Medical Shop Name</th>
              <th>Receipt No</th>
              <th>Receipt Date</th>
              <th>Price (₹)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="medicineTbody">
            <tr>
              <td>1</td>
              <td><input type="text" name="medicalshop[]" required></td>
              <td><input type="text" name="receipt[]" required></td>
              <td><input type="date" name="date[]" required></td>
              <td><input type="number" name="price[]" class="price-input" step="0.01" oninput="calculateTotal()" required></td>
              <td><button type="button" class="btn-danger" onclick="removeRow(this)">X</button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn-secondary" onclick="addRow()">+ Add Medicine</button>

        <div class="form-group total-container">
          <label for="amount"><strong>Total Amount Claimed (₹):</strong></label>
          <input type="number" id="amount" name="amount" readonly>
        </div>
      </fieldset>

      <!-- Section 3: Declarations -->
      <fieldset>     

        <div class="form-group">
          <label for="today">Date of Application:</label>
          <input type="date" id="today" name="today" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Application</button>
      </fieldset>
    </form>
    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
